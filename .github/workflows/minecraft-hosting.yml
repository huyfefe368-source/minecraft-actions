name: Minecraft Hosting - Drive Storage and Panel

on:
  workflow_dispatch:
    inputs:
      restore_backup:
        description: "Optional backup file from Drive/backups"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: minecraft-hosting
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      VPS_HOST: 160.191.51.148
      VPS_USER: mcbridge
      VPS_HOST_FINGERPRINT: SHA256:RVTCTS7egIm44gW78qATnuIF3UNdxU/2EI9oUMSIhds
      DRIVE_BASE: drive:Minecraft-Hosting
      RESTORE_BACKUP: ${{ inputs.restore_backup }}
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_REF: feat/minecraft-hosting-v2
      MC_CONTROL_TOKEN: ${{ secrets.MC_CONTROL_TOKEN }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      TUNNEL_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
      ACCEPT_MINECRAFT_EULA: ${{ vars.ACCEPT_MINECRAFT_EULA }}
    steps:
      - name: Checkout hosting scripts
        uses: actions/checkout@v4
      - name: Show runner hardware
        run: |
          echo "CPU cores: $(nproc)"
          free -h
          df -h .
      - name: Install panel-selectable Java runtimes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21
            25
      - name: Install verified rclone v1.76.0
        shell: bash
        run: |
          set -euo pipefail
          version=v1.76.0
          name=rclone-$version-linux-amd64.zip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "https://downloads.rclone.org/$version/$name"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "https://downloads.rclone.org/$version/SHA256SUMS"
          cd "$RUNNER_TEMP"
          grep -E "[[:space:]]$name$" SHA256SUMS | sha256sum -c -
          unzip -p "$name" "rclone-$version-linux-amd64/rclone" > rclone
          chmod 755 rclone
          sudo install -m 755 rclone /usr/local/bin/rclone
          rclone version | head -1
      - name: Start Minecraft and persistent Drive backup
        shell: bash
        run: bash scripts/run_server.sh
