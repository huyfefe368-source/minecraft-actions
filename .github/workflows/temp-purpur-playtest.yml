name: Temp Purpur 1.21.11 - Interactive Development Playtest

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Playtest minutes (manual restart only)'
        required: true
        default: '120'
        type: choice
        options: ['20', '60', '120', '180', '240']

permissions:
  contents: read

concurrency:
  group: temporary-purpur-12111-testing
  cancel-in-progress: false

jobs:
  purpur-dev-test:
    name: Purpur with remote console and full Git tree persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start and monitor Minecraft worker
        env:
          TEMP_PURPUR_SSH_KEY: ${{ secrets.TEMP_PURPUR_SSH_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/temp_mc_service.py start '${{ inputs.duration_minutes }}'
      - name: Always stop Minecraft and persist full server tree
        if: ${{ always() }}
        timeout-minutes: 5
        run: python3 scripts/temp_mc_service.py stop
