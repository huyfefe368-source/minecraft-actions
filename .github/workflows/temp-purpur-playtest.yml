name: Temp Purpur 1.21.11 - Interactive Development Playtest

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Playtest minutes (manual restart only)'
        required: true
        default: '120'
        type: choice
        options:
          - '20'
          - '60'
          - '120'
          - '180'
          - '240'

permissions:
  contents: read

concurrency:
  group: temporary-purpur-12111-testing
  cancel-in-progress: false

jobs:
  purpur-dev-test:
    name: Run Purpur, gracefully stop, archive everything, upload to private release
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify archive utilities
        run: |
          set -euo pipefail
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          command -v rsync || (sudo apt-get update -qq && sudo apt-get install -y rsync)
          command -v ssh
          command -v curl
          command -v unzip
          java -version
      - name: Restore and run Minecraft, then publish full backup
        env:
          TEMP_PURPUR_SSH_KEY: ${{ secrets.TEMP_PURPUR_SSH_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scripts/temp-purpur-runner.py '${{ inputs.duration_minutes }}'
